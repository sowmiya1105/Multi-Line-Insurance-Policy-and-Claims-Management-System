<template>
    <lightning-card title="Assigned Claims" icon-name="standard:case">

        <template if:true={hasClaims}>
            <div class="slds-p-around_medium">

                <template for:each={claims} for:item="claim">
                    <div key={claim.claimId} class="claim-card">

                        <p>
                            <strong>Claim Number:</strong>
                            {claim.claimNumber}
                        </p>

                        <p>
                            <strong>Claim Amount:</strong>
                            ₹{claim.claimAmount}
                        </p>

                        <p>
                            <strong>Status:</strong>
                            {claim.status}
                        </p>

                        <p>
                            <strong>Policy Type:</strong>
                            {claim.policyType}
                        </p>

                        <p>
                            <strong>Policy Holder:</strong>
                            {claim.policyHolderName}
                        </p>

                        <p>
                            <strong>Days Open:</strong>
                            {claim.daysOpen}
                        </p>

                    </div>
                </template>

            </div>
        </template>

        <template if:false={hasClaims}>
            <div class="slds-p-around_medium">
                No claims assigned to you.
            </div>
        </template>

    </lightning-card>
</template>
